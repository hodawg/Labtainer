server {
listen 80;
server_name server;
root /var/www/html;
index index.html;
}
server {
listen 443 ssl;
server_name server;
ssl_certificate /etc/nginx/ssl/server.crt;
ssl_certificate_key /etc/nginx/ssl/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers on;
root /var/www/html;
index index.html;
}
