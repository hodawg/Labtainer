server {
listen 80;
server_name server;
root /var/www/html;
index index.html;
location = /login {
default_type text/plain;
return 200 "Login received\n";
}
}
server {
listen 443 ssl;
server_name server;
ssl_certificate /etc/nginx/ssl/server.crt;
ssl_certificate_key /etc/nginx/ssl/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
root /var/www/html;
index index.html;
location = /login {
default_type text/plain;
return 200 "Login received\n";
}
}
